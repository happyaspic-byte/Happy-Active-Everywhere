name: Verify and package

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install stable Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable
          rustc --version --verbose
          cargo --version
      - name: Format
        run: |
          cargo fmt --all
          git diff --exit-code
      - name: Lint
        if: ${{ !cancelled() }}
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Tests
        if: ${{ !cancelled() }}
        run: cargo test --locked --all-targets --no-fail-fast -- --nocapture
      - name: Upload recovery failure evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: recovery-evidence-${{ matrix.os }}-${{ github.sha }}
          path: |
            folder-report/recovery-evidence/
            !folder-report/recovery-evidence/**/identity.key.der
          if-no-files-found: ignore
          retention-days: 14
      - name: Installer acceptance
        if: ${{ !cancelled() }}
        shell: bash
        run: python scripts/verify-install.py --binary target/debug/everywhere${{ runner.os == 'Windows' && '.exe' || '' }}
      - name: Folder delta acceptance
        if: ${{ !cancelled() && runner.os == 'Linux' }}
        run: python scripts/bench_folder.py --binary target/debug/everywhere --mib 8 --files 20 --report folder-report/delta.json --require-delta
      - name: Browser acceptance
        if: ${{ !cancelled() && runner.os == 'Linux' }}
        shell: bash
        run: |
          npm install --prefix "$RUNNER_TEMP/everywhere-browser" --no-save --ignore-scripts playwright@1.62.1
          node "$RUNNER_TEMP/everywhere-browser/node_modules/playwright/cli.js" install --with-deps chromium
          PLAYWRIGHT_MODULE="$RUNNER_TEMP/everywhere-browser/node_modules/playwright" node scripts/verify-browser.cjs
      - name: Upload browser evidence
        if: ${{ !cancelled() && runner.os == 'Linux' }}
        uses: actions/upload-artifact@v4
        with:
          name: browser-evidence-${{ github.sha }}
          path: browser-report/
          if-no-files-found: warn
          retention-days: 14
      - name: Release build
        run: cargo build --release --locked
      - name: Real APFS volume fault acceptance
        if: ${{ success() && runner.os == 'macOS' }}
        run: python3 scripts/verify-volume-faults.py --binary target/release/everywhere --report folder-report/volume-ci.json
      - name: Upload volume fault evidence
        if: ${{ !cancelled() && runner.os == 'macOS' }}
        uses: actions/upload-artifact@v4
        with:
          name: volume-fault-evidence-${{ github.sha }}
          path: |
            folder-report/volume-ci.json
            folder-report/volume-evidence-*/**/*.json
            folder-report/volume-evidence-*/**/*.sql
            folder-report/volume-evidence-*/**/*.sqlite
            folder-report/volume-evidence-*/**/*.stdout
            folder-report/volume-evidence-*/**/*.stderr
          if-no-files-found: warn
          retention-days: 14
      - name: Release folder benchmark
        if: ${{ success() && runner.os == 'Linux' }}
        run: python scripts/bench_folder.py --binary target/release/everywhere --mib 128 --files 1000 --report folder-report/release.json --require-delta
      - name: Upload folder measurements
        if: ${{ !cancelled() && runner.os == 'Linux' }}
        uses: actions/upload-artifact@v4
        with:
          name: folder-measurements-${{ github.sha }}
          path: folder-report/*.json
          if-no-files-found: warn
          retention-days: 14
      - name: Package verified release build
        run: python scripts/package.py
      - name: Upload binary and verification documents
        uses: actions/upload-artifact@v4
        with:
          name: everywhere-${{ matrix.os }}-${{ github.sha }}
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
          retention-days: 14
