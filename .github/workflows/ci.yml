name: Verify and package

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install stable Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable
          rustc --version --verbose
          cargo --version
      - name: Format
        run: |
          cargo fmt --all
          git diff --exit-code
      - name: Lint
        if: ${{ !cancelled() }}
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Tests
        if: ${{ !cancelled() }}
        run: cargo test --locked --all-targets -- --nocapture
      - name: Release build
        run: cargo build --release --locked
      - name: Upload binary and verification documents
        uses: actions/upload-artifact@v4
        with:
          name: everywhere-${{ matrix.os }}-${{ github.sha }}
          path: |
            target/release/everywhere
            target/release/everywhere.exe
            README.md
            docs/
          if-no-files-found: error
          retention-days: 14
