name: Verify and package

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install stable Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable
          rustc --version --verbose
          cargo --version
      - name: Format
        run: |
          cargo fmt --all
          git diff --exit-code
      - name: Lint
        if: ${{ !cancelled() }}
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Tests
        if: ${{ !cancelled() }}
        run: cargo test --locked --all-targets --no-fail-fast -- --nocapture
      - name: Upload recovery failure evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: recovery-evidence-${{ matrix.os }}-${{ github.sha }}
          path: |
            folder-report/recovery-evidence/
            !folder-report/recovery-evidence/**/identity.key.der
            !folder-report/recovery-evidence/**/*.agekey
            !folder-report/recovery-evidence/**/*.age
          if-no-files-found: ignore
          retention-days: 14
      - name: Installer acceptance
        if: ${{ !cancelled() }}
        shell: bash
        run: python scripts/verify-install.py --binary target/debug/everywhere${{ runner.os == 'Windows' && '.exe' || '' }}
      - name: Package content acceptance
        if: ${{ !cancelled() }}
        run: python scripts/verify-package.py
      - name: Managed soak negative acceptance
        if: ${{ success() }}
        run: python -m unittest discover -s scripts -p test_soak.py -v
      - name: Managed three-peer smoke
        if: ${{ success() }}
        shell: bash
        run: python scripts/soak.py run --binary target/debug/everywhere${{ runner.os == 'Windows' && '.exe' || '' }} --work-dir "${{ runner.temp }}/managed-soak-${{ github.run_id }}-${{ github.run_attempt }}" --seconds 10 --min-cycles 2 --cycle-interval 0
      - name: Upload managed soak summary
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: managed-soak-${{ matrix.os }}-${{ github.sha }}
          path: ${{ runner.temp }}/managed-soak-${{ github.run_id }}-${{ github.run_attempt }}/summary.json
          if-no-files-found: warn
          retention-days: 14
      - name: Storage registration acceptance
        if: ${{ success() }}
        shell: bash
        run: python scripts/verify-storage-preflight.py --binary target/debug/everywhere${{ runner.os == 'Windows' && '.exe' || '' }} --report folder-report/storage-ci.json
      - name: Upload storage registration summary
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: storage-registration-${{ matrix.os }}-${{ github.sha }}
          path: folder-report/storage-ci.json
          if-no-files-found: warn
          retention-days: 14
      - name: Storage probe replacement regression
        if: ${{ success() && runner.os != 'Windows' }}
        run: python3 scripts/verify-preflight-race.py --binary target/debug/everywhere --report folder-report/storage-race-ci.json
      - name: Upload storage replacement summary
        if: ${{ !cancelled() && runner.os != 'Windows' }}
        uses: actions/upload-artifact@v4
        with:
          name: storage-replacement-${{ matrix.os }}-${{ github.sha }}
          path: folder-report/storage-race-ci.json
          if-no-files-found: warn
          retention-days: 14
      - name: Prepare hosted Linux user service manager
        if: ${{ success() && runner.os == 'Linux' }}
        shell: bash
        run: |
          export XDG_RUNTIME_DIR="/run/user/$(id -u)"
          export DBUS_SESSION_BUS_ADDRESS="unix:path=$XDG_RUNTIME_DIR/bus"
          if ! systemctl --user show-environment >/dev/null 2>&1; then
            sudo loginctl enable-linger "$(id -un)"
            sudo systemctl start "user@$(id -u).service"
          fi
          systemctl --user show-environment >/dev/null
          printf 'XDG_RUNTIME_DIR=%s\nDBUS_SESSION_BUS_ADDRESS=%s\n' "$XDG_RUNTIME_DIR" "$DBUS_SESSION_BUS_ADDRESS" >> "$GITHUB_ENV"
      - name: Native user service acceptance
        if: ${{ success() }}
        shell: bash
        run: python scripts/verify-service.py --binary target/debug/everywhere${{ runner.os == 'Windows' && '.exe' || '' }} --report folder-report/service-ci.json
      - name: Upload service evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: service-evidence-${{ matrix.os }}-${{ github.sha }}
          path: |
            folder-report/service-ci*.json
            folder-report/service-evidence-*/**
            folder-report/service-evidence/**/*.json
            folder-report/service-evidence/**/*.log
            folder-report/service-evidence/**/*.sqlite*
          if-no-files-found: ignore
          retention-days: 14
      - name: Folder delta acceptance
        if: ${{ !cancelled() && runner.os == 'Linux' }}
        run: python scripts/bench_folder.py --binary target/debug/everywhere --mib 8 --files 20 --report folder-report/delta.json --require-delta
      - name: Browser acceptance
        if: ${{ !cancelled() && runner.os == 'Linux' }}
        shell: bash
        run: |
          npm install --prefix "$RUNNER_TEMP/everywhere-browser" --no-save --ignore-scripts playwright@1.62.1
          node "$RUNNER_TEMP/everywhere-browser/node_modules/playwright/cli.js" install --with-deps chromium
          PLAYWRIGHT_MODULE="$RUNNER_TEMP/everywhere-browser/node_modules/playwright" node scripts/verify-browser.cjs
      - name: Upload browser evidence
        if: ${{ !cancelled() && runner.os == 'Linux' }}
        uses: actions/upload-artifact@v4
        with:
          name: browser-evidence-${{ github.sha }}
          path: browser-report/
          if-no-files-found: warn
          retention-days: 14
      - name: Release build
        run: cargo build --release --locked
      - name: Real APFS volume fault acceptance
        if: ${{ success() && runner.os == 'macOS' }}
        run: python3 scripts/verify-volume-faults.py --binary target/release/everywhere --report folder-report/volume-ci.json
      - name: Upload volume fault evidence
        if: ${{ !cancelled() && runner.os == 'macOS' }}
        uses: actions/upload-artifact@v4
        with:
          name: volume-fault-evidence-${{ github.sha }}
          path: |
            folder-report/volume-ci.json
            folder-report/volume-evidence-*/**/*.json
            folder-report/volume-evidence-*/**/*.sql
            folder-report/volume-evidence-*/**/*.sqlite
            folder-report/volume-evidence-*/**/*.stdout
            folder-report/volume-evidence-*/**/*.stderr
          if-no-files-found: warn
          retention-days: 14
      - name: Release folder benchmark
        if: ${{ success() && runner.os == 'Linux' }}
        run: python scripts/bench_folder.py --binary target/release/everywhere --mib 128 --files 1000 --report folder-report/release.json --require-delta
      - name: Upload folder measurements
        if: ${{ !cancelled() && runner.os == 'Linux' }}
        uses: actions/upload-artifact@v4
        with:
          name: folder-measurements-${{ github.sha }}
          path: folder-report/*.json
          if-no-files-found: warn
          retention-days: 14
      - name: Package verified release build
        run: python scripts/package.py
      - name: Upload binary and verification documents
        uses: actions/upload-artifact@v4
        with:
          name: everywhere-${{ matrix.os }}-${{ github.sha }}
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
          retention-days: 14
